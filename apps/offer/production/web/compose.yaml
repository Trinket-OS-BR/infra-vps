# Offer (Next.js). Imagem pronta do GHCR; a VPS não recebe código-fonte nem roda build.
# Banco: PostgreSQL da plataforma, pela rede interna `data`. Uploads: R2 (a rede `proxy` dá a saída à internet).
# Porta interna 4101 (docs/padroes.md). Quem recebe tráfego HTTP é o proxy; aqui nada é publicado.
name: offer-web-production

services:
  web:
    image: ghcr.io/tonybsilva-dev/${IMAGE_NAME:-offer}:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    container_name: offer-web-production
    restart: unless-stopped
    init: true
    # As credenciais de observabilidade ficam só na VPS (scripts/observability-create-org.sh); sem o arquivo, o app sobe sem enviar dados.
    env_file:
      - .env.production
      - path: /srv/secrets/offer-observability.env
        required: false
    environment:
      - OTEL_SERVICE_NAME=offer-web-production
      - PORT=4101
      - HOSTNAME=0.0.0.0
    expose: ["4101"]
    networks: [proxy, data]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      app.product: offer
      app.service: web
      app.environment: production

networks:
  proxy:
    external: true
    name: proxy
  data:
    external: true
    name: data
