name: superhotdog-web-production
services:
  web:
    image: superhotdog-web-production:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    pull_policy: never
    container_name: superhotdog-web-production
    restart: unless-stopped
    init: true
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4128"
      OTEL_SERVICE_NAME: superhotdog-web-production
    expose: ["4128"]
    networks: [proxy, data]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4128/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      app.product: superhotdog
      app.service: web
      app.environment: production
networks:
  proxy:
    external: true
    name: proxy
  data:
    external: true
    name: data
