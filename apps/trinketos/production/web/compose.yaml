# TrinketOS web (BFF + interface). Imagem pronta do GHCR; a VPS não recebe código-fonte nem roda build.
# Fala com a API pela rede interna `data` (API_INTERNAL_URL), sem passar pela internet.
# Porta interna 4111 (docs/padroes.md). Quem recebe tráfego HTTP é o proxy; aqui nada é publicado.
#
# As NEXT_PUBLIC_* são embutidas na imagem no build (variável do repositório). O .env.production (gravado
# pelo deploy) traz só segredos e ajustes de runtime.
#
# Telemetria pronta, ainda DESLIGADA: para ligar ao OpenObserve, copie /srv/secrets/trinketos-observability.env
# para /srv/secrets/trinketos-web-observability.env (modo 600) e refaça o deploy. Sem o arquivo, o app roda igual.
name: trinketos-web-production

services:
  web:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER obrigatoria}/${IMAGE_NAME:-web-trinketos}:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    container_name: trinketos-web-production
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
      - path: /srv/secrets/trinketos-web-observability.env
        required: false
    environment:
      - PORT=4111
      - NITRO_PORT=4111
      - API_INTERNAL_URL=http://trinketos-api-production:4110/api/v1
      - OTEL_SERVICE_NAME=trinketos-web-production
    expose: ["4111"]
    networks: [proxy, data]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4111/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      app.product: trinketos
      app.service: web
      app.environment: production

networks:
  proxy:
    external: true
    name: proxy
  data:
    external: true
    name: data
