# TrinketOS Workspace (painel interno: interface estática + servidor Node que repassa tudo à API).
# Imagem pronta do GHCR; a VPS não recebe código-fonte nem roda build.
# Não usa Postgres, Redis nem RabbitMQ: só fala com a API, pela rede interna `data` (API_INTERNAL_URL).
# Porta interna 4112 (docs/padroes.md). Quem recebe tráfego HTTP é o proxy; aqui nada é publicado.
#
# O .env.production (gravado pelo deploy) traz APP_ORIGIN e AUTH_COOKIE_NAME. Não há segredo no bundle.
#
# Telemetria pronta, ainda DESLIGADA: para ligar ao OpenObserve, crie /srv/secrets/trinketos-workspace-observability.env
# (modo 600, a partir do arquivo de observabilidade do produto) e refaça o deploy. Sem o arquivo, o app roda igual.
name: trinketos-workspace-production

services:
  workspace:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER obrigatoria}/${IMAGE_NAME:-workspace-trinketos}:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    container_name: trinketos-workspace-production
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
      - path: /srv/secrets/trinketos-workspace-observability.env
        required: false
    environment:
      - PORT=4112
      - API_INTERNAL_URL=http://trinketos-api-production:4110/api/v1
      - OTEL_SERVICE_NAME=trinketos-workspace-production
    expose: ["4112"]
    networks: [proxy, data]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4112/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      app.product: trinketos
      app.service: workspace
      app.environment: production

networks:
  proxy:
    external: true
    name: proxy
  data:
    external: true
    name: data
