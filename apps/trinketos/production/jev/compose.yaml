# TrinketOS decision service (shadow). Image built on the workstation and sent over SSH (no GHCR, no Actions).
# Internal port 4115 (infra-vps docs/padroes.md). Only the `data` network: the API reaches it by name and the
# container has no route to the internet, so ticket text cannot leave the VPS through it.
name: trinketos-jev-production

services:
  jev:
    image: jev-trinketos:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    pull_policy: never
    container_name: trinketos-jev-production
    restart: unless-stopped
    init: true
    env_file:
      # Written on the VPS by deploy/push-env.sh; holds DECISIONS_SERVICE_TOKEN. The API reads the same file.
      # Without it the service refuses to start (no token) and never becomes healthy.
      - path: /srv/secrets/trinketos-decisions.env
        required: false
    environment:
      - PORT=4115
      - DECISIONS_THREADS=2
    expose: ["4115"]
    networks: [data]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4115/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      app.product: trinketos
      app.service: jev
      app.environment: production

networks:
  data:
    external: true
    name: data
