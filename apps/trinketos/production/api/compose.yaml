# TrinketOS API (Spring Boot). Imagem pronta do GHCR; a VPS não recebe código-fonte nem roda build.
# Dados: PostgreSQL, Redis e RabbitMQ da plataforma, pela rede interna `data`.
# Traces: OpenObserve (agente OpenTelemetry da imagem). Porta interna 4110 (docs/padroes.md).
# Quem recebe tráfego HTTP é o proxy; aqui nada é publicado.
#
# Credenciais de infraestrutura NÃO vêm do CI: ficam em /srv/secrets/trinketos-api-infra.env
# (gerado por make-infra-env.sh a partir dos arquivos dos scripts postgres/redis/rabbitmq/observability).
# O .env.production (gravado pelo deploy) traz só os segredos do produto (JWT, chaves de IA, e-mail, R2).
name: trinketos-api-production

services:
  api:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER obrigatoria}/${IMAGE_NAME:-api-trinketos}:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    container_name: trinketos-api-production
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
      # Sem o arquivo a API não acha o banco e não fica healthy: o deploy falha e volta sozinho.
      - path: /srv/secrets/trinketos-api-infra.env
        required: false
    environment:
      - SERVER_PORT=4110
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=70 -javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=trinketos-api-production
    expose: ["4110"]
    # Só `data` até a virada: sem `proxy` o contêiner não tem saída para a internet, então a cópia
    # dos dados de produção não consegue enviar e-mail nem webhook. Na virada, acrescente `proxy`.
    networks: [data]
    mem_limit: 1280m
    cpus: 1.5
    pids_limit: 400
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4110/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      app.product: trinketos
      app.service: api
      app.environment: production

networks:
  data:
    external: true
    name: data
