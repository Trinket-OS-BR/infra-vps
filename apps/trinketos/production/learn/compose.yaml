# TrinketOS Learn (Next.js standalone: interface + servidor que repassa tudo à API).
# Imagem pronta do GHCR; a VPS não recebe código-fonte nem roda build.
# Não usa Postgres, Redis nem RabbitMQ: só fala com a API, pela rede interna `data` (API_INTERNAL_URL).
# Porta interna 4114 (docs/padroes.md). Quem recebe tráfego HTTP é o proxy; aqui nada é publicado.
#
# NEXT_PUBLIC_WEB_URL é embutida na imagem no build (variável do repositório). O .env.production (gravado
# pelo deploy) traz APP_ORIGIN e AUTH_COOKIE_NAME.
#
# Telemetria pronta, ainda DESLIGADA: para ligar ao OpenObserve, crie /srv/secrets/trinketos-learn-observability.env
# (modo 600, a partir do arquivo de observabilidade do produto) e refaça o deploy. Sem o arquivo, o app roda igual.
name: trinketos-learn-production

services:
  learn:
    image: ghcr.io/${IMAGE_OWNER:?IMAGE_OWNER obrigatoria}/${IMAGE_NAME:-learn-trinketos}:${IMAGE_TAG:?IMAGE_TAG obrigatoria}
    container_name: trinketos-learn-production
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
      - path: /srv/secrets/trinketos-learn-observability.env
        required: false
    environment:
      - PORT=4114
      - API_INTERNAL_URL=http://trinketos-api-production:4110/api/v1
      - OTEL_SERVICE_NAME=trinketos-learn-production
    expose: ["4114"]
    networks: [proxy, data]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4114/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      app.product: trinketos
      app.service: learn
      app.environment: production

networks:
  proxy:
    external: true
    name: proxy
  data:
    external: true
    name: data
