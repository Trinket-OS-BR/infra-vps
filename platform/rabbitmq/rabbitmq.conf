# RabbitMQ compartilhado da plataforma. Isolamento entre produtos: um vhost e um usuário por produto,
# com permissão só no próprio vhost (scripts/rabbitmq-create-vhost.sh). Ver docs/padroes.md e a Wiki (página 17).

# Portas internas em faixa observável (docs/padroes.md); nada é publicado no host.
listeners.tcp.default = 4132
stomp.listeners.tcp.1 = 4133
management.tcp.port = 4134

# STOMP: o cliente informa o vhost no cabeçalho `host` do CONNECT; sem login e senha não há conexão.
stomp.implicit_connect = false

# Tetos de recursos (o contêiner tem folga acima disso).
vm_memory_high_watermark.absolute = 384MB
disk_free_limit.absolute = 1GB

log.console = true
log.console.level = info
