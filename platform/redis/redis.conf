# Redis compartilhado da plataforma. Cada produto tem um usuário (ACL) restrito ao seu prefixo de chave;
# o usuário `default` fica desligado e o administrador vive só no .env. Ver docs/padroes.md e a Wiki (página 16).
port 4131
# Só alcançável pela rede interna `data` (nada é publicado no host).
bind 0.0.0.0
protected-mode yes

# Usuários e permissões persistem aqui (ACL SAVE). O arquivo é criado na primeira subida pelo compose.
aclfile /data/users.acl

dir /data
appendonly yes
appendfsync everysec
save 3600 1 300 100 60 10000
tcp-keepalive 60

# Teto de memória compartilhado. volatile-lru só descarta chaves com TTL: cache deve sempre usar TTL;
# filas e dados sem TTL nunca são descartados (se a memória encher, a escrita falha em vez de perder dado).
maxmemory 256mb
maxmemory-policy volatile-lru
